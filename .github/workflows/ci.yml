name: CI Pipeline

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-format:
    name: Lint, Formatting & Import Order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install black ruff isort flake8 bandit

      - name: Check code formatting (black)
        run: black --check src tests manage.py scripts

      - name: Check import order (isort)
        run: isort --check-only src tests manage.py scripts

      - name: Lint with ruff
        run: ruff check src tests manage.py

      - name: Lint with flake8
        run: |
          flake8 src tests manage.py --max-line-length=110 --exclude=migrations,.venv,src/static

      - name: Security scan with bandit
        run: bandit -r src -ll --skip B101,B104,B311

  migrate-check:
    name: Migrations in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Dry-run migrations are in sync
        run: python manage.py makemigrations --check --dry-run

      - name: Deploy settings check
        env:
          DJANGO_SECRET_KEY: ci-generated-${{ github.run_id }}-${{ github.sha }}-not-a-real-secret-0123456789
        run: python manage.py check --deploy --fail-level ERROR

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: [lint-format, migrate-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fieldops_nexus_test
          POSTGRES_USER: fieldops_user
          POSTGRES_PASSWORD: local-ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://fieldops_user:local-ci-test-only@localhost:5432/fieldops_nexus_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.lock pytest pytest-cov

      - name: Run test suite with coverage
        run: pytest --cov=src/apps --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.lock

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fieldops-nexus:ci .
